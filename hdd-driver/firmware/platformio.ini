; Firmware for the hdd-driver carrier: WeAct STM32G474 Core Board + SimpleFOC Mini (DRV8313).
[env:weact_g474]
platform = ststm32
board = weact_g474ceu6
framework = arduino
lib_deps = askuric/Simple FOC@2.3.4
monitor_speed = 115200

; USB CDC serial on the board's USB-C (Serial = SerialUSB).
build_flags =
    -DUSBCON
    -DUSBD_USE_CDC
    -DHAL_PCD_MODULE_ENABLED
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -DUSBD_VID=0x0483
    -DUSBD_PID=0x5740
    -DUSB_MANUFACTURER_STRING=\"vr-exciter\"
    -DUSB_PRODUCT_STRING=\"hdd-driver\"

; No debug probe: flash over the ROM DFU bootloader (hold BOOT0, tap NRST).
upload_protocol = dfu

; Link the library as objects, not as an archive. With an archive the linker takes
; SimpleFOC's weak generic _configure3PWM/_writeDutyCycle3PWM (analogWrite, 1 kHz,
; 8 bit) and never pulls in the STM32 timer driver (center-aligned, 25 kHz).
lib_archive = no
